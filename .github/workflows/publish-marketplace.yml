# ------------------------------------------------------------------
# Publish to VS Code Marketplace (Manual)
# ------------------------------------------------------------------
# Triggered manually from GitHub Actions UI.
# Downloads the selected release's attested VSIX, verifies its provenance,
# and publishes those exact bytes to the VS Code Marketplace.
#
# Required secret: VSCE_PAT (Azure DevOps PAT with Marketplace > Manage scope)
#
# Usage:
#   GitHub -> Actions -> "Publish to Marketplace" -> Run workflow
#   Select the release tag to publish (e.g. v8.0.0)
# ------------------------------------------------------------------

name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v8.0.0)'
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  publish:
    name: Publish ${{ github.event.inputs.tag }} to Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Validate extension quality gates
        working-directory: vscode-extension
        run: |
          npm run test:coverage
          npm audit --omit=dev --audit-level=high

      - name: Download attested release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        working-directory: vscode-extension
        run: gh release download "$RELEASE_TAG" --pattern 'agentx-*.vsix'

      - name: Verify release provenance
        working-directory: vscode-extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify agentx-*.vsix --repo "$GITHUB_REPOSITORY"

      - name: Publish to VS Code Marketplace
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX_FILE=$(ls agentx-*.vsix)
          npx @vscode/vsce publish --pat "$VSCE_PAT" --packagePath "$VSIX_FILE"
