name: Issue Triage
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Classify Issue
        id: classify
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/classify-issue.js --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --github-output >> "$GITHUB_OUTPUT"

      - name: Apply Labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const type = '${{ steps.classify.outputs.type }}';
            const domains = '${{ steps.classify.outputs.domains }}'.trim().split(/\s+/).filter(Boolean);
            const labels = [type, ...domains];

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

      - name: Post Routing Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const route = '${{ steps.classify.outputs.route }}';
            const type = '${{ steps.classify.outputs.type }}';
            const domains = '${{ steps.classify.outputs.domains }}'.trim();

            let body = `**Auto-Triage**\n\n`;
            body += `- **Type**: \`${type}\`\n`;
            body += `- **Route to**: ${route}\n`;
            if (domains) body += `- **Domain signals**: ${domains}\n`;
            body += `\n> Classified by issue-triage workflow. Adjust labels if incorrect.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
