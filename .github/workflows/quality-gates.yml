name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to validate'
        required: true
        type: string

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  quality-checks:
    name: Enforce Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: |
          npm ci --ignore-scripts --prefix vscode-extension
          npm ci --ignore-scripts --prefix companions/whatsapp

      - name: Setup Environment
        run: |
          echo "ISSUE_NUMBER=${{ github.event.pull_request.number || github.event.inputs.issue_number }}" >> $GITHUB_ENV

      - name: Check Secrets in Code
        run: |
          echo "Scanning for hardcoded secrets..."
          if git diff HEAD~1..HEAD | grep -iE '(password|api[_-]?key|secret|token|private[_-]?key)\s*=\s*["\047]'; then
            echo "[FAIL] BLOCKED: Potential secrets detected in commit"
            echo "Detected patterns:"
            git diff HEAD~1..HEAD | grep -iE '(password|api[_-]?key|secret|token|private[_-]?key)\s*=\s*["\047]' || true
            exit 1
          fi
          echo "[PASS] No secrets detected"

      - name: Validate Commit Messages
        if: github.event_name == 'pull_request'
        run: |
          echo "Validating commit messages..."
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s")

          # Check for issue reference
          if ! echo "$COMMITS" | grep -qE '#[0-9]+'; then
            echo "[FAIL] BLOCKED: No issue reference (#123) found in commit messages"
            echo "Commits must reference an issue number"
            exit 1
          fi

          # Check for conventional commit format
          if ! echo "$COMMITS" | grep -qE '^(feat|fix|docs|test|refactor|perf|chore):'; then
            echo "[WARN] WARNING: Commits should follow conventional commit format (feat:, fix:, etc.)"
          fi

          echo "[PASS] Commit message validation passed"

      - name: Documentation Drift Gate
        shell: pwsh
        run: |
          $workspaceRoot = (Resolve-Path -LiteralPath '.').Path
          $rawDocDrift = & pwsh -NoProfile -NonInteractive -File ./scripts/check-doc-drift.ps1 -Action check -WorkspaceRoot $workspaceRoot -PolicyPath .github/documentation-facts.json -Json
          $docDriftExitCode = $LASTEXITCODE
          $serializedDocDrift = ($rawDocDrift | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($serializedDocDrift)) {
            throw 'Documentation drift checker produced no JSON output.'
          }
          $docDrift = $serializedDocDrift | ConvertFrom-Json -Depth 12
          $claimIssues = if ($docDrift.PSObject.Properties['issues']) { @($docDrift.issues).Count } else { 0 }
          $brokenLinks = if ($docDrift.PSObject.Properties['references'] -and $docDrift.references.PSObject.Properties['broken']) { @($docDrift.references.broken).Count } else { 0 }
          Write-Host 'Documentation drift check is mandatory for feature/story/bug and documentation-consolidation changes.'
          Write-Host "Documentation drift status: $($docDrift.status)"
          Write-Host 'Facts policy: .github/documentation-facts.json (required)'
          if ($docDrift.PSObject.Properties['factsStatus']) {
            Write-Host "Facts status: $($docDrift.factsStatus)"
          }
          if ($docDrift.PSObject.Properties['checkedClaims']) {
            Write-Host "Claims checked: $($docDrift.checkedClaims)"
          }
          Write-Host "Claim issues: $claimIssues"
          Write-Host "Broken links: $brokenLinks"
          if ($docDrift.PSObject.Properties['message']) {
            Write-Host "Documentation drift message: $($docDrift.message)"
          }
          Write-Host "Semantic review required: $($docDrift.semanticReviewRequired)"
          $summary = @(
            '## Documentation Drift',
            '',
            "- Status: $($docDrift.status)",
            '- Policy: `.github/documentation-facts.json` (required)',
            "- Facts status: $($docDrift.factsStatus)",
            "- Claims checked: $($docDrift.checkedClaims)",
            "- Claim issues: $claimIssues",
            "- Broken links: $brokenLinks",
            "- Semantic review required: $($docDrift.semanticReviewRequired)"
          )
          if ($docDrift.PSObject.Properties['message']) {
            $summary += "- Message: $($docDrift.message)"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n")
          if ($docDriftExitCode -ne 0) {
            exit $docDriftExitCode
          }

          $csharpFiles = @(Get-ChildItem -LiteralPath $workspaceRoot -Recurse -Filter '*.cs' -File | Where-Object {
            $_.FullName -notmatch '[/\\](obj|bin)[/\\]'
          })
          if ($csharpFiles.Count -eq 0) {
            Write-Host '[PASS] No C# files found for XML documentation advisory check'
          } else {
            $undocumented = 0
            foreach ($file in $csharpFiles) {
              $content = Get-Content -LiteralPath $file.FullName -Raw
              if ($content -match '\bpublic\b' -and $content -notmatch '///') {
                $undocumented++
              }
            }

            if ($undocumented -gt 0) {
              Write-Host "::warning::$undocumented C# files with public APIs missing XML docs."
            } else {
              Write-Host '[PASS] C# XML documentation advisory check passed'
            }
          }
      - name: Validate File Structure
        run: |
          echo "Validating file structure..."

          # Check for proper docs structure (canonical artifact paths)
          if [ -d "docs" ]; then
            for dir in docs/artifacts/prd docs/artifacts/adr docs/artifacts/specs docs/artifacts/reviews docs/ux; do
              if [ ! -d "$dir" ]; then
                echo "[WARN] WARNING: $dir/ directory not found"
              fi
            done
          fi

          echo "[PASS] File structure validation complete"

      - name: Harness Plan and Evidence Check
        shell: pwsh
        run: |
          ./scripts/check-harness-compliance.ps1 -BaseRef "${{ github.base_ref }}"

      - name: Token Budget Report
        shell: pwsh
        env:
          TOKEN_EVENT_NAME: ${{ github.event_name }}
          TOKEN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $eventName = $env:TOKEN_EVENT_NAME
          $baselineRef = $env:TOKEN_BASE_SHA
          $reportArgs = @('-Action', 'report', '-Json')
          $mode = 'full-check'
          if ($eventName -eq 'pull_request' -and $baselineRef) {
            $mode = 'no-regression'
            $reportArgs += @('-BaselineRef', $baselineRef)
          } elseif ($eventName -eq 'pull_request') {
            Write-Host '::warning::No trusted PR base SHA was provided; falling back to the full token budget report.'
          }
          Write-Host "Token budget report mode: $mode"
          if ($baselineRef) {
            Write-Host "Trusted PR base SHA: $baselineRef"
          }
          $rawReport = & pwsh -NoProfile -NonInteractive -File ./scripts/token-counter.ps1 @reportArgs
          $reportExitCode = $LASTEXITCODE
          $reportPath = Join-Path $env:RUNNER_TEMP 'token-budget-report.json'
          $serializedReport = ($rawReport | Out-String).Trim()
          [System.IO.File]::WriteAllText($reportPath, $serializedReport, [System.Text.UTF8Encoding]::new($false))
          if ([string]::IsNullOrWhiteSpace($serializedReport)) {
            throw 'Token budget report produced no JSON output.'
          }
          $report = $serializedReport | ConvertFrom-Json -Depth 10
          Write-Host "Full token report saved to $reportPath"
          Write-Host "Coverage: $($report.checkedFiles)/$($report.scannedFiles); total overages: $(@($report.violations).Count); new/growing: $(@($report.regressions).Count)"
          $summary = @(
            '## Token Budget',
            '',
            "- Mode: $mode",
            $(if ($baselineRef) { '- Trusted baseline: ' + $baselineRef } else { '- Trusted baseline: _none_' }),
            "- Status: $($report.status)",
            "- Total overages (all): $(@($report.violations).Count)",
            "- Regressions (new/grown only): $(@($report.regressions).Count)",
            "- Scanned files: $($report.scannedFiles)",
            "- Checked files: $($report.checkedFiles)"
          )
          if ($mode -eq 'no-regression' -and @($report.violations).Count -gt 0 -and @($report.regressions).Count -eq 0) {
            $summary += '- Inherited overages remain visible; the PR gate enforces no regression against the trusted base SHA.'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n")
          if ($reportExitCode -ne 0) {
            exit $reportExitCode
          }

      - name: Upload Token Budget Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: token-budget-report
          path: ${{ runner.temp }}/token-budget-report.json
          if-no-files-found: error

      - name: Token Budget Check
        shell: pwsh
        env:
          TOKEN_EVENT_NAME: ${{ github.event_name }}
          TOKEN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $eventName = $env:TOKEN_EVENT_NAME
          $baselineRef = $env:TOKEN_BASE_SHA
          $checkArgs = @('-Action', 'check')
          if ($eventName -eq 'pull_request' -and $baselineRef) {
            Write-Host 'Token budget gate mode: no-regression'
            Write-Host "Trusted PR base SHA: $baselineRef"
            $checkArgs += @('-BaselineRef', $baselineRef)
          } elseif ($eventName -eq 'pull_request') {
            Write-Host '::warning::No trusted PR base SHA was provided; falling back to the full token budget gate.'
            Write-Host 'Token budget gate mode: full-check'
          } else {
            Write-Host 'Token budget gate mode: full-check'
          }
          & pwsh -NoProfile -NonInteractive -File ./scripts/token-counter.ps1 @checkArgs
          exit $LASTEXITCODE

      - name: Skill Validation Pipeline
        shell: pwsh
        run: |
          ./scripts/validate-skill.ps1
          $base = if ("${{ github.event.pull_request.base.sha }}") { "${{ github.event.pull_request.base.sha }}" } else { 'origin/master' }
          $head = if ("${{ github.event.pull_request.head.sha }}") { "${{ github.event.pull_request.head.sha }}" } else { 'HEAD' }
          ./scripts/validate-changed-skills.ps1 -BaseRef $base -HeadRef $head -MinScore 70

      - name: Skill Rubric Behavior
        shell: pwsh
        run: ./tests/skill-rubric-behavior.ps1

      - name: Deterministic Regression Suite
        shell: pwsh
        run: |
          $regressionSuites = @(
            'tests/token-budget-behavior.ps1',
            'tests/token-budget-ci-behavior.ps1',
            'tests/model-route-behavior.ps1',
            'tests/budget-behavior.ps1',
            'tests/scrub-behavior.ps1',
            'tests/code-quality-rubric-behavior.ps1',
            'tests/doc-drift-behavior.ps1',
            'tests/doc-drift-ci-behavior.ps1'
          )
          foreach ($suite in $regressionSuites) {
            if (-not (Test-Path -LiteralPath $suite)) {
              throw "Required regression suite script not found: $suite"
            }
            Write-Host "Running $suite"
            & pwsh -NoProfile -NonInteractive -File $suite
            $suiteExitCode = $LASTEXITCODE
            if ($suiteExitCode -ne 0) {
              exit $suiteExitCode
            }
          }

      - name: Copilot Host Compatibility
        shell: pwsh
        run: |
          # Build the extension asset bundle first: the seed-provenance and
          # bundle-completeness assertions validate generated output that is
          # gitignored, so without this step they would silently skip.
          Push-Location vscode-extension
          try {
            npm ci --no-audit --no-fund
            $npmCiExitCode = $LASTEXITCODE
            if ($npmCiExitCode -ne 0) {
              exit $npmCiExitCode
            }
            node scripts/copy-assets.js
            $copyAssetsExitCode = $LASTEXITCODE
            if ($copyAssetsExitCode -ne 0) {
              exit $copyAssetsExitCode
            }
          } finally {
            Pop-Location
          }
          & pwsh -NoProfile -File ./tests/copilot-host-compatibility-behavior.ps1
          $copilotHostCompatibilityExitCode = $LASTEXITCODE
          if ($copilotHostCompatibilityExitCode -ne 0) {
            exit $copilotHostCompatibilityExitCode
          }
          & pwsh -NoProfile -File ./tests/harness-distribution-behavior.ps1
          $harnessDistributionExitCode = $LASTEXITCODE
          if ($harnessDistributionExitCode -ne 0) {
            exit $harnessDistributionExitCode
          }

      - name: Version Stamper Behavior
        run: node tests/stamp-version-behavior.js

      - name: WhatsApp Companion Quality Gate
        working-directory: companions/whatsapp
        run: |
          npm test
          npm run test:coverage
          npm run audit:runtime

      - name: Extension Lint and Test
        if: hashFiles('vscode-extension/package.json') != ''
        working-directory: vscode-extension
        run: |
          echo "Running extension test gate and lint advisory..."
          npm ci
          npm run test:coverage
          xvfb-run -a npm run test:e2e
          npm audit --omit=dev --audit-level=high
          npm run lint || echo "[WARN] Lint warnings/errors present (advisory mode)"
          echo "[PASS] Extension unit, Extension Host, coverage, and audit gates passed"

      - name: Agent Deliverable Validation
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Validating agent deliverables..."

          # Extract issue number from PR title or branch
          ISSUE_NUM=$(printf '%s' "$PR_TITLE" | grep -oP '#\K\d+' | head -1)

          if [ -z "$ISSUE_NUM" ]; then
            # Try to get from branch name (e.g. feature/123-description)
            ISSUE_NUM=$(printf '%s' "$HEAD_REF" | grep -oP '^\w+/\K\d+' | head -1)
          fi

          if [ -z "$ISSUE_NUM" ]; then
            echo "[INFO] No issue number found in PR title or branch, skipping agent validation"
            exit 0
          fi

          echo "Found issue #${ISSUE_NUM}"

          # Detect agent role from PR labels
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels -q '.labels[].name' 2>/dev/null || echo "")

          ROLE=""
          if echo "$LABELS" | grep -q "type:epic"; then
            ROLE="pm"
          elif echo "$LABELS" | grep -q "type:feature"; then
            ROLE="architect"
          elif echo "$LABELS" | grep -q "type:story"; then
            ROLE="engineer"
          elif echo "$LABELS" | grep -q "type:bug"; then
            ROLE="engineer"
          elif echo "$LABELS" | grep -q "type:devops"; then
            ROLE="devops"
          elif echo "$LABELS" | grep -q "needs:ux"; then
            ROLE="ux"
          fi

          # If no role from labels, try to detect from files changed
          if [ -z "$ROLE" ]; then
            FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}..HEAD)

            if echo "$FILES_CHANGED" | grep -q "docs/artifacts/prd/"; then
              ROLE="pm"
            elif echo "$FILES_CHANGED" | grep -q "docs/artifacts/adr/\|docs/artifacts/specs/"; then
              ROLE="architect"
            elif echo "$FILES_CHANGED" | grep -q "docs/ux/"; then
              ROLE="ux"
            elif echo "$FILES_CHANGED" | grep -q "docs/artifacts/reviews/"; then
              ROLE="reviewer"
            elif echo "$FILES_CHANGED" | grep -qE "\.(cs|py|ts|js|go|rs)$"; then
              ROLE="engineer"
            elif echo "$FILES_CHANGED" | grep -q ".github/workflows/"; then
              ROLE="devops"
            fi
          fi

          if [ -z "$ROLE" ]; then
            echo "[INFO] Could not determine agent role from labels or files"
            exit 0
          fi

          echo "Detected role: $ROLE"

          # Run validation script if it exists
          if [ -f ".github/scripts/validate-handoff.sh" ]; then
            chmod +x .github/scripts/validate-handoff.sh
            echo "Running validation for issue #${ISSUE_NUM} as ${ROLE}..."
            ./.github/scripts/validate-handoff.sh "$ISSUE_NUM" "$ROLE" || {
              echo "[WARN] Validation warnings detected (see above)"
              # Don't fail the job, just report
            }
          else
            echo "[WARN] validate-handoff.sh not found"
          fi

      - name: Post Quality Report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '[PASS]' : '[FAIL]';
            const report = `
            ## Quality Gate Report

            | Check | Status |
            |-------|--------|
            | Secret Detection | ${status} |
            | Commit Message Format | ${status} |
            | Documentation Drift | ${status} |
            | File Structure | ${status} |

            ${status === '[PASS]' ? '[PASS] All quality gates passed!' : '[FAIL] Quality gates failed. Please fix the issues above.'}

            ---
            *AgentX Quality Gates* | [View Workflow](../../.github/workflows/quality-gates.yml)
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
