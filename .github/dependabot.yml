version: 2

updates:
  # VS Code extension -- the only package tree that ships to users.
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "type:devops"
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # Batch routine dev-tooling bumps into one PR to limit review churn.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Companion packages -- not shipped in the VSIX, so security updates only.
  - package-ecosystem: npm
    directory: /companions/whatsapp
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - "type:devops"
      - "dependencies"
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: /companions/video-studio
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - "type:devops"
      - "dependencies"
    commit-message:
      prefix: "chore"

  # Keep pinned action SHAs current -- pinning without updates goes stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "type:devops"
      - "dependencies"
    commit-message:
      prefix: "chore"
