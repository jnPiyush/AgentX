trigger:
- master

pr:
- master

pool:
  vmImage: ubuntu-latest

variables:
  node_version: '20.x'

stages:
- stage: validate
  displayName: Validate AgentX
  jobs:
  - job: quality_gates
    displayName: Run shared validation gates
    steps:
    - checkout: self
      fetchDepth: 0

    - task: NodeTool@0
      displayName: Use Node.js $(node_version)
      inputs:
        versionSpec: $(node_version)

    - task: PowerShell@2
      displayName: Harness plan and evidence check
      inputs:
        pwsh: true
        targetType: filePath
        filePath: scripts/check-harness-compliance.ps1
        arguments: -BaseRef "$(System.PullRequest.TargetBranch)"

    - script: npm ci
      displayName: Install extension dependencies
      workingDirectory: vscode-extension

    - script: npm test
      displayName: Run extension tests
      workingDirectory: vscode-extension

    - task: PowerShell@2
      displayName: Validate skill rubric and inventory
      inputs:
        pwsh: true
        targetType: inline
        script: |
          ./tests/skill-rubric-behavior.ps1
          ./scripts/validate-skill.ps1
          $targetBranch = "$env:SYSTEM_PULLREQUEST_TARGETBRANCH" -replace '^refs/heads/', ''
          $base = if ($targetBranch) { "origin/$targetBranch" } else { 'origin/master' }
          ./scripts/validate-changed-skills.ps1 -BaseRef $base -HeadRef HEAD -MinScore 70

    - script: |
        npm ci --ignore-scripts
        npm test
        npm run test:coverage
        npm run audit:runtime
      displayName: Validate WhatsApp companion
      workingDirectory: companions/whatsapp
